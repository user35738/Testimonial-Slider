<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Testimonial Slider</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>

    <main class="slider" aria-roledescription="carousel" aria-label="Customer testimonials">
      <span class="quote-mark" aria-hidden="true">“</span>

      <div class="stage" aria-live="polite">
        <div class="stars" aria-label="5 out of 5 stars">★★★★★</div>
        <blockquote class="text"></blockquote>
        <div class="person">
          <h4 class="username"></h4>
          <p class="role"></p>
        </div>
      </div>

      <div class="controls">
        <button class="arrow" id="prev" aria-label="Previous testimonial">‹</button>
        <div class="avatars" id="avatars"></div>
        <button class="arrow" id="next" aria-label="Next testimonial">›</button>
      </div>
    </main>

    <script src="index.js"></script>
  </body>
</html>
